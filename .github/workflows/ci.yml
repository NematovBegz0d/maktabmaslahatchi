name: CI

# Har push (main) va har PR'da: tiplar + lint + testlar
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Lockfile Windows'da yaratilgani uchun Linux rollup binarisini o'z ichiga
      # olmaydi (npm bug #4828). npm ci bilan qadalgan daraxtni o'rnatamiz, so'ng
      # yetishmagan Linux rollup binarisini qo'shamiz.
      #
      # MUHIM: `--no-package-lock` ATAYLAB OLIB TASHLANDI. U lockfile'ni chetlab
      # o'tib, paketlarni `^` oralig'ida yangiroq versiyalarga ko'tarardi
      # (vite 7.3.2 -> 7.3.6, tanstack, prettier 3.8 -> 3.9 ...) va bu prerender
      # hamda lint regressiyalarini keltirib chiqarardi. `--no-package-lock`siz
      # `npm install <paket>` lockfile'ni hurmat qiladi: faqat yetishmagan binarini
      # qo'shadi, qolgan barcha versiya qadalganicha qoladi (drift yo'q).
      - name: O'rnatish
        run: npm ci

      - name: Linux rollup binarisi (npm #4828 vaqtinchalik yechimi)
        run: |
          npm install --no-save --legacy-peer-deps \
            "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"

      - name: Schema-sync (migratsiya ↔ types.ts drift)
        run: npm run check:schema

      - name: Tiplar (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Testlar (vitest)
        run: npm test

      # Build buzilmaganini ham tekshiramiz (yuqoridagi rollup binarisi shu yerda
      # ham ishlatiladi). "build yashil" holati endi CI'da majburiy.
      - name: Build (vite)
        run: npm run build
