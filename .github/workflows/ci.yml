name: CI

# Har push (main) va har PR'da: tiplar + lint + testlar
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` o'rniga `npm install`: lockfile Windows'da yaratilgani uchun
      # faqat win32 rollup binarisini sanaydi. `npm ci` qat'iy bo'lib, Linux
      # runnerda `@rollup/rollup-linux-x64-gnu` ni o'rnatmaydi (npm bug #4828).
      # `npm install` joriy platforma uchun kerakli optional-dep'ni o'rnatadi.
      - name: O'rnatish
        run: npm install

      - name: Tiplar (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Testlar (vitest)
        run: npm test
