name: CI

# Har push (main) va har PR'da: tiplar + lint + testlar
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Lockfile Windows'da yaratilgani uchun Linux uchun mo'ljallangan native
      # binarilarni o'z ichiga olmaydi (npm bug #4828): u faqat win32 variantlarni
      # yozadi. npm ci qadalgan daraxtni o'rnatadi, so'ng yetishmagan Linux
      # binarilarini qo'lda qo'shamiz.
      #
      # MUHIM: `--no-package-lock` ATAYLAB OLIB TASHLANDI. U lockfile'ni chetlab
      # o'tib, paketlarni `^` oralig'ida yangiroq versiyalarga ko'tarardi
      # (vite 7.3.2 -> 7.3.6, tanstack, prettier 3.8 -> 3.9 ...) va bu prerender
      # hamda lint regressiyalarini keltirib chiqarardi. `--no-package-lock`siz
      # `npm install <paket>` lockfile'ni hurmat qiladi: faqat yetishmagan binarini
      # qo'shadi, qolgan barcha versiya qadalganicha qoladi (drift yo'q).
      - name: O'rnatish
        run: npm ci

      # rollup, lightningcss, @tailwindcss/oxide va rolldown'da install-script YO'Q,
      # shuning uchun native binari faqat optional-dep orqali keladi — Linux'da esa
      # lockfile uni tushirib qoldirgani sabab yetishmaydi (build "Cannot find module
      # ...linux-x64-gnu.node" bilan yiqiladi). rolldown'ni nitro (TanStack Start
      # build/prerender engine'i) ishlatadi. esbuild bu ro'yxatda emas: unda
      # hasInstallScript=true, o'z binarisini o'zi yuklab oladi.
      # Versiyalarni o'rnatilgan paketdan o'qiymiz — drift bo'lmaydi.
      - name: Linux native binarilari (npm #4828 vaqtinchalik yechimi)
        run: |
          npm install --no-save --legacy-peer-deps \
            "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")" \
            "lightningcss-linux-x64-gnu@$(node -p "require('lightningcss/package.json').version")" \
            "@tailwindcss/oxide-linux-x64-gnu@$(node -p "require('@tailwindcss/oxide/package.json').version")" \
            "@rolldown/binding-linux-x64-gnu@$(node -p "require('rolldown/package.json').version")"

      - name: Schema-sync (migratsiya ↔ types.ts drift)
        run: npm run check:schema

      - name: Tiplar (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Testlar (vitest)
        run: npm test

      # Build buzilmaganini ham tekshiramiz (yuqoridagi rollup binarisi shu yerda
      # ham ishlatiladi). "build yashil" holati endi CI'da majburiy.
      - name: Build (vite)
        run: npm run build
