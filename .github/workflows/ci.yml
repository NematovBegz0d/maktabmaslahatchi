name: CI

# Har push (main) va har PR'da: tiplar + lint + testlar
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Lockfile Windows'da yaratilgani uchun Linux rollup binarisini sanamaydi
      # (npm bug #4828). Uni o'chirib toza resolve qilib bo'lmaydi — peer-dep
      # konfliktiga uchraydi (vite-tanstack-config <-> nitro). Shuning uchun:
      # npm ci bilan barqaror, qadalgan daraxt + yetishmagan Linux rollup
      # binarisini (aynan o'sha versiyada) committed fayllarga tegmasdan qo'shamiz.
      - name: O'rnatish
        run: npm ci

      - name: Linux rollup binarisi (npm #4828 vaqtinchalik yechimi)
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps \
            "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"

      - name: Tiplar (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Testlar (vitest)
        run: npm test
