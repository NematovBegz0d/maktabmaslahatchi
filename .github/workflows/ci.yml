name: CI

# Har push (main) va har PR'da: tiplar + lint + testlar
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Lockfile Windows'da yaratilgani uchun faqat win32 rollup binarisini
      # sanaydi. Lockfile mavjud bo'lsa npm uni "to'liq" deb hisoblab, Linux
      # uchun @rollup/rollup-linux-x64-gnu ni o'rnatmaydi (npm bug #4828 —
      # `npm ci` ham, `npm install` ham). Yagona ishonchli yo'l: lockfile'ni
      # o'chirib, Linux uchun toza resolve qilish (node_modules CI'da baribir toza).
      - name: O'rnatish
        run: |
          rm -f package-lock.json
          npm install

      - name: Tiplar (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Testlar (vitest)
        run: npm test
