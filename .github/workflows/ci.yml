name: CI

# Har push (main) va har PR'da: tiplar + lint + testlar
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: O'rnatish
        run: npm ci

      - name: Tiplar (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Testlar (vitest)
        run: npm test
