# ============================================================================
# Netlify deploy konfiguratsiyasi — EduLens (TanStack Start, SPA rejimi)
# Statik SPA sifatida deploy qilinadi; ma'lumotlar client tomonda Supabase orqali.
# ============================================================================

[build]
  # MUHIM: lockfile'ni O'CHIRMAYMIZ. Avval uni `rm -rf` qilib toza `npm install`
  # qilardik — bu paketlarni `^` oralig'ida eng yangi versiyaga ko'tarardi
  # (vite 7.3.2 -> 7.3.6, tanstack/nitro ...). Yangi nitro server bundle'ni
  # `dist/server` o'rniga `.netlify/functions-internal` ga chiqaradi, TanStack
  # Start prerender'i esa `dist/server/server.js` ni topolmay `/` da 500 qaytarib
  # build'ni yiqitardi (ERR_MODULE_NOT_FOUND).
  #
  # Buning o'rniga GitHub CI bilan bir xil yo'l: `npm ci` lockfile'ga qadaydi
  # (vite 7.3.2 — prerender to'g'ri ishlaydi), so'ng Windows lockfile tushirib
  # qoldirgan Linux native binarilarni qo'lda qo'shamiz (npm bug #4828).
  #
  # Versiyalar lockfile'dagi qiymatlarga QAT'IY mos bo'lishi shart. Lockfile bu
  # paketlarni yangilasa, quyidagilarni ham yangilang — aks holda build native
  # binary versiya nomuvofiqligi bilan OCHIQ yiqiladi (jim regressiya emas):
  #   rollup, lightningcss, @tailwindcss/oxide, rolldown
  command = "npm ci --legacy-peer-deps && npm install --no-save --legacy-peer-deps @rollup/rollup-linux-x64-gnu@4.60.2 lightningcss-linux-x64-gnu@1.32.0 @tailwindcss/oxide-linux-x64-gnu@4.2.4 @rolldown/binding-linux-x64-gnu@1.0.2 && npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  # Quyidagilar PUBLIC (anon) kalit + URL — client bundle'ga baribir kiritiladi, xavfsiz.
  # Xohlasangiz Netlify dashboard (Site settings → Environment variables) orqali ham
  # o'rnatishingiz mumkin — dashboard qiymatlari ustun bo'ladi.
  VITE_SUPABASE_URL = "https://irkoxlxdpkisfvwtxsga.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlya294bHhkcGtpc2Z2d3R4c2dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjgzNjMsImV4cCI6MjA5NjM0NDM2M30.g0DWKm0YRlKgi2_XQ8H0xHN28bkfZRPMPv7KTbUDIOE"

# Statik resurslarni keshlash (assets — hash bilan, abadiy keshlash mumkin)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback — mavjud bo'lmagan barcha yo'llar index.html ga yo'naltiriladi.
# Haqiqiy fayllar (/assets/*, /logo.png) avval xizmat qilinadi; faqat topilmaganlar
# index.html ga tushadi va client router (TanStack Router) ularni boshqaradi.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
